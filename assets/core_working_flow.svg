<desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">A user query goes to Gemini to generate SQL, which is checked for SELECT-only. Safe SELECT queries execute in DuckDB and return a result with confidence 1. Modification queries are blocked and return no result with confidence 0.</desc>
